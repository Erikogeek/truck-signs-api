# Build and publish the docker image to the Github Container Register
name: Build Application

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

# Grant permission to pubish packages to GHCR
permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      # Download the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v6
    
      # Authenticate with GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set up QEMU for multi-plattform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      # Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Build and publish the image with  a stable and a version tag.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.IMAGE_NAME }}:latest
            ${{ vars.IMAGE_NAME }}:${{ github.ref_type == 'tag' && github.ref_name || 'manual' }}
    